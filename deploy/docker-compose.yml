# Hanubix server on the Hostinger KVM 2 (plan locked 12 Nov 2026). One machine: Postgres, the Hanubix server, Caddy (HTTPS).
# The server image is tagged with the git commit, so the previous version is always on the machine for a rollback.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbrox
      POSTGRES_USER: hanubix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hanubix -d dbrox"], interval: 10s, retries: 6 }

  server:
    image: hanubix-server:${TAG:?deploy.sh sets TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://hanubix:${DB_PASSWORD}@db:5432/dbrox
    depends_on: { db: { condition: service_healthy } }
    stop_grace_period: 30s   # a stopping server finishes the requests and relay batch in hand
    expose: [ "8080" ]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to server:8080
    volumes: [ "caddydata:/data" ]

volumes: { pgdata: {}, caddydata: {} }
