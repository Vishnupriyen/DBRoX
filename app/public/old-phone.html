<!doctype html>
<!-- Shown instead of a blank screen when the phone's Android System WebView is too old for Hanubix (older than version 87,
     late 2020). Plain old HTML and no new features on purpose, so even a very old phone can show it. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanubix — update needed</title>
<style>
  body { margin: 0; background: #ffffff; font-family: Montserrat, Roboto, Arial, sans-serif; color: #10231b; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 48px 24px; text-align: center; }
  .logo { width: 180px; height: auto; margin: 0 auto 28px; display: block; }
  h1 { color: #0b4a35; font-size: 22px; line-height: 1.3; margin: 0 0 14px; }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 14px; color: #3c4d45; }
  .btn { display: block; margin: 26px auto 12px; padding: 16px 20px; border-radius: 14px; background: #0b4a35; color: #ffffff;
         font-size: 17px; font-weight: bold; text-decoration: none; }
  .btn.second { background: #ffffff; color: #0b4a35; border: 2px solid #0b4a35; margin-top: 0; }
  .small { font-size: 13px; color: #6b7a73; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="hanubix-wordmark.svg" alt="Hanubix">
  <h1>This phone needs one update to run Hanubix</h1>
  <p>Please update <b>Android System WebView</b> and <b>Google Chrome</b> from the Play Store, then open Hanubix again.</p>
  <p>It is free and takes about two minutes on Wi-Fi.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.google.android.webview">Update Android System WebView</a>
  <a class="btn second" href="https://play.google.com/store/apps/details?id=com.android.chrome">Update Google Chrome</a>
  <p class="small" id="ver"></p>
</div>
<script>
  var m = /(?:Chrome|Chromium)\/(\d+)/.exec(navigator.userAgent);
  document.getElementById('ver').innerHTML = 'Your phone has version ' + (m ? m[1] : 'unknown') + '. Hanubix needs 87 or newer.';
</script>
</body>
</html>
