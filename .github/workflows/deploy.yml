# Marks a commit as safe to deploy on the Hostinger server (plan locked 12 Nov 2026; the old Cloud Run deploy is gone).
# Run it by hand from the Actions tab on the commit to release. It runs the full quality gate and the server tests; only
# if both pass it tags the commit gate-<commit>. deploy/deploy.sh on the server refuses any commit without that tag.
name: Deploy
on:
  workflow_dispatch:

permissions:
  contents: write   # to push the gate-<commit> tag

jobs:
  gate:   # nothing deploys unless the full quality gate passes on this exact code
    uses: ./.github/workflows/quality.yml

  tag:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag this commit as gate-passed
        run: |
          T="gate-$(git rev-parse --short HEAD)"
          git tag "$T" && git push origin "$T"
          echo "✔ $T — on the server: git pull && deploy/deploy.sh (between 11 pm and 5 am IST)" >> "$GITHUB_STEP_SUMMARY"
