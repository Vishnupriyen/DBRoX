# Runs the release gate on every push and pull request. A red ✗ here means: do not release.
name: Quality gate
on:
  push:
  pull_request:
  workflow_call:   # the Deploy workflow calls this first; deploy stops if it fails

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      # the chaos laws run several phones against the real server (its own Postgres): the server's packages too
      - run: npm ci && node scripts/relay-copy.mjs
        working-directory: server
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run gate
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: gate-screens, path: app/e2e/out, retention-days: 7 }

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: node scripts/relay-copy.mjs   # the relay's one source is shared/relay.ts
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
