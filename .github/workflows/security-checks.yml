# Security checks (security standard, 13 Nov 2026 — free tools only). Every push, every pull request, and every Monday.
# - npm audit: known holes in the app's and the server's packages (fails on critical; high ones are listed for the weekly review)
# - gitleaks: no password, key or token ever committed (the whole history)
# - Trivy: the server's Dockerfile and the deploy files checked for risky settings; packages scanned again
# - SBOM: the list of every package in this build, kept with the run (an auditor asks for it at each release)
name: Security checks
on:
  push:
  pull_request:
  schedule: [ { cron: '30 3 * * 1' } ]   # Mondays 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy: { matrix: { dir: [app, server] } }
    defaults: { run: { working-directory: '${{ matrix.dir }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Known holes in packages (report)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Known holes in packages (critical fails the run)
        run: npm audit --omit=dev --audit-level=critical
      - name: SBOM (list of every package)
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom-${{ matrix.dir }}.json
      - uses: actions/upload-artifact@v4
        with: { name: 'sbom-${{ matrix.dir }}', path: '${{ matrix.dir }}/sbom-${{ matrix.dir }}.json', retention-days: 90 }

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (free, open source) over the whole history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (free, open source) — Dockerfile, compose and packages
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '0'      # listed for the weekly review; critical package holes fail in the audit job above
          ignore-unfixed: true
